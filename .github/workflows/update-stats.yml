name: Update profile page

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
    - cron: "5 18 * * *"    # 00:05 Asia/Dhaka, so the date flips right after midnight
  workflow_dispatch:         # run it manually from the Actions tab any time
  push:
    paths:
      - "scripts/generate_page.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate page
        env:
          # Add a personal access token (scope: read:user) as the repo secret STATS_TOKEN
          # to count private contributions too. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          STATS_TZ: Asia/Dhaka
        run: python scripts/generate_page.py "$GITHUB_USER"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update profile page"
            git pull --rebase
            git push
          fi